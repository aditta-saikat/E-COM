name: product-catalog-service CI

on:
  push:
    branches: [main]
    paths:
      - 'product-catalog-service/**'
      - '.github/workflows/product-catalog-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'product-catalog-service/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/product-catalog-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product-catalog-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: product-catalog-service/package-lock.json

      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: product-catalog-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
